apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlok-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shlok-web
  template:
    metadata:
      labels:
        app: shlok-web
    spec:
      containers:
        - name: web
          image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/shlok-project13-app:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shlok-web
spec:
  type: LoadBalancer
  selector:
    app: shlok-web
  ports:
    - port: 80
      targetPort: 80
